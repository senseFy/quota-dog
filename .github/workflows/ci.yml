name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + Android debug build
    # macOS runner is required because :shared:allTests runs the
    # iosSimulatorArm64Test Kotlin/Native binary.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run multiplatform tests
        run: ./gradlew :shared:allTests --stacktrace

      - name: Run desktop UI and updater receipt tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test update publishing and macOS packaging
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 scripts/tests/updater_release_test.py
          python3 scripts/tests/macos_packaging_test.py

      - name: Run mobile release contract tests
        run: make test-mobile-release

      - name: Test update hosting
        run: node --test infra/cloudflare/worker.test.mjs

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
